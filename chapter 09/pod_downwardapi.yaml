apiVersion: v1
kind: Pod
metadata:
  name: downwardapi-pod
  labels:
    app: demo-app
spec:
  containers:
  - name: demo-container
    image: busybox
    command: ["sh", "-c", "echo POD_NAME=$POD_NAME; echo POD_NAMESPACE=$POD_NAMESPACE; cat /etc/pod-info/labels; cat /etc/pod-info/cpu_limit; sleep 3600"]
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    volumeMounts:
    - name: pod-info
      mountPath: /etc/pod-info
  volumes:
  - name: pod-info
    downwardAPI:
      items:
      - path: "labels"
        fieldRef:
          fieldPath: metadata.labels
      - path: "cpu_limit"
        resourceFieldRef:
          containerName: demo-container
          resource: limits.cpu